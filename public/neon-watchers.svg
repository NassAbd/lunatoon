  <path d="m52 79 20 145-19 55m899-188-18 152 19 40" stroke="#091720" stroke-width="4"/>
  <path d="m69 296-6 25m858-39-8 30m-806 46-7 26m777-35-9 32" stroke="#84a0a4" stroke-opacity=".24" stroke-width="1.2"/>
</svg>
