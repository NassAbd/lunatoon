  <path d="m498 307 49 24 51 12 37-17 28 30-31-9-34 15-55-12-47-34Z" fill="#795541"/>
  <!-- Intact square case, projected above the fingers. -->
  <path d="m522 218 117-29 42 111-114 34-42-101Z" fill="#07131c" stroke="#0a1721" stroke-width="6" stroke-linejoin="round"/>
  <path d="m525 219 113-27 37 99-113 33Z" fill="#10212b" stroke="#45666e" stroke-width="2.5"/>
  <path d="m535 225 95-23 31 82-94 28Z" fill="#0a1721"/>
  <path d="m563 240 48-12 17 47-46 14Z" fill="#184c50"/>
  <path d="m573 245 29-8 12 32-29 8Z" fill="#75fff3"/>
  <path d="m581 249 16-4 7 19-16 5Z" fill="#c5fff5"/>
