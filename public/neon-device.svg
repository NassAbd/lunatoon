<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" fill="none">
  <title>The black device in Kael's hand</title>
  <desc>An original close-up of a palm-sized black square with a cyan core, held above broken station tiles. A mustard coat cuff enters the frame; the fractured advertisement behind it has no lettering.</desc>
  <path fill="#102630" d="M0 0h1000v520H0z"/>
  <!-- Broken station surfaces frame the held prop; it has no ground contact. -->
  <path d="m0 77 383-77h333L383 125 0 190Z" fill="#173744"/>
  <path d="m0 207 390-66 150 38-267 171L0 385Z" fill="#1e3b46"/>
  <path d="m0 407 273-41 167 154H0Z" fill="#19313d"/>
  <path d="m302 361 253-168 445 88v239H470Z" fill="#142c37"/>
  <path d="M0 199 388 132l158 42m-260 184 167 162M404 139l-21-14 52-33-8-17 49-23M165 381l55-29-19-20 52-34m469-98 24 56-32 30 51 38" stroke="#081820" stroke-width="5"/>
  <path d="m0 187 382-67m-98 230 148-100m55 216 24 19m164-219 54 13" stroke="#36555f" stroke-width="2"/>
  <!-- A shattered, blank advertisement casing in the distant upper corner. -->
  <path d="m691-26 320 53 25 179-110-18-41-46-34 24-129-22-18-67-24 9Z" fill="#0a1721" stroke="#34515d" stroke-width="5"/>
  <path d="m713 0 274 45 15 118-67-11-47-43-39 25-105-18-9-58-18 5Z" fill="#29434d"/>
  <path d="m743 25 133 22 10 36-136-21Zm164 29 53 9 7 47-47-7Z" fill="#49626a"/>
  <path d="m778 1-8 38 30 33-24 37m140-70-38 47 10 23m-51-74-15 38" stroke="#102630" stroke-width="4"/>
  <path d="m840 184 37 8-17 18Zm87 44 33 3-9 22Zm-679 57 26-22 14 18-32 18Zm-96 158 42-10-11 18Z" fill="#3b5862"/>
  <path d="m111 452 49-8m104-165 13 1m569-87 16 4m69 37 15 2" stroke="#789197" stroke-opacity=".5" stroke-width="2"/>
  <!-- Sleeve and palm share the immutable opening's mustard / brown anchors. -->
  <path d="m704 344 296 80v96H797l-136-94-35-57Z" fill="#d2a751" stroke="#0a1721" stroke-width="6"/>
  <path d="m701 371 299 118v31H797l-136-94Z" fill="#77643b"/>
  <path d="m699 344-46 37 28 56 50-49Z" fill="#b78b43" stroke="#0a1721" stroke-width="5"/>
  <path d="m744 394 77 63m-17-62 120 47m-105 67 95-11" stroke="#6c5736" stroke-width="4"/>
